name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (npm build)
    runs-on: [self-hosted, opencode-sam, nuxsshterm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend (cargo check / clippy / test)
    # Runs inside a container so the Tauri Linux build dependencies can be
    # installed with apt-get as root. The self-hosted runner is unprivileged
    # (no sudo), so the previous `sudo apt-get install` on the host would fail.
    runs-on: [self-hosted, opencode-sam, nuxsshterm]
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 Linux build dependencies (webkit2gtk, gtk3, etc.)
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml