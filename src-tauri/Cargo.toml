[package]
name = "nuxsshterm"
version = "0.4.0"
description = "A tabbed SSH solution for Linux — a native reimplementation of WinSSHTerm"
authors = ["Sam Ralial"]
edition = "2024"

[lib]
name = "nuxsshterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
quick-xml = "0.37"
base64 = "0.22"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
# Phase 1 — encrypted vault
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1"
# Phase 3 — SFTP commander local pane
tokio = { version = "1", features = ["fs"] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
